services:
  db:
    image: postgres:16-alpine
    profiles:
      - docker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-deep_search_results}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deep_search_results}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      POSTGRES_HOST: ${API_POSTGRES_HOST:-db}
      POSTGRES_PORT: ${API_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-deep_search_results}
      MAX_CONCURRENT_SCRAPES: ${MAX_CONCURRENT_SCRAPES:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8007:8000"

  frontend:
    image: python:3.12-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend:ro
    command: ["python", "-m", "http.server", "5174", "--bind", "0.0.0.0"]
    ports:
      - "5174:5174"
    depends_on:
      - api

volumes:
  postgres_data:
