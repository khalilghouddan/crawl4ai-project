services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${API_POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${API_POSTGRES_PORT:-5433}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-deep_search_results}
      MAX_CONCURRENT_SCRAPES: ${MAX_CONCURRENT_SCRAPES:-10}
      SCRAPE_BATCH_TIMEOUT_SECONDS: ${SCRAPE_BATCH_TIMEOUT_SECONDS:-240}
      SCRAPE_PAGE_TIMEOUT_MS: ${SCRAPE_PAGE_TIMEOUT_MS:-60000}
      SCRAPE_STATIC_FETCH_TIMEOUT_SECONDS: ${SCRAPE_STATIC_FETCH_TIMEOUT_SECONDS:-20}
      SCRAPE_CACHE_TTL_SECONDS: ${SCRAPE_CACHE_TTL_SECONDS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8007:8000"

  frontend:
    image: python:3.12-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend:ro
    command: ["python", "-m", "http.server", "5174", "--bind", "0.0.0.0"]
    ports:
      - "5174:5174"
    depends_on:
      api:
        condition: service_started
